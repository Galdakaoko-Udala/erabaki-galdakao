name: Test decidim-galdakao_census [localgem]

# This workflow is designed exclusively to run the specs for the local gem
# decidim-galdakao_census. To do so, it swaps the repository's Gemfile and
# Gemfile.lock with the gem-specific versions (which include test dependencies:
# webmock, rspec-rails, decidim-dev, etc.), so that the main repository Gemfile
# is not modified and the production environment is not affected.
# The swap is safe because the GitHub Actions runner is ephemeral.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  RUBY_VERSION: 3.3.10
  NODE_VERSION: 22.14.0

jobs:
  test:
    name: Test galdakao_census [localgem] specs
    runs-on: ubuntu-latest
    if: "!startsWith(github.head_ref, 'chore/l10n')"
    timeout-minutes: 60
    env:
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_HOST: localhost
      RUBYOPT: '-W:no-deprecated'
    services:
      postgres:
        image: postgres:17
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        env:
          RAILS_ENV: test
          DATABASE_USERNAME: postgres
          DATABASE_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Replace the repository's Gemfile and Gemfile.lock with the gem-specific
      # versions that include test dependencies (webmock, rspec-rails, decidim-dev).
      # Safe to do here because the runner is ephemeral and nothing persists after the run.
      - name: Swap Gemfile and Gemfile.lock for gem-specific versions
        run: |
          cp gems/decidim-galdakao_census/Gemfile Gemfile
          cp gems/decidim-galdakao_census/Gemfile.lock Gemfile.lock

      - run: |
          sudo apt-get update; sudo apt-get -f install wkhtmltopdf imagemagick

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ./package-lock.json

      - name: Setup & create Database
        run: |
          bundle exec rails db:create db:schema:load
        env:
          RAILS_ENV: test
          DATABASE_USERNAME: postgres
          DATABASE_PASSWORD: postgres

      # TEMPORARY: Run pending migrations so the test database includes the
      # galdakao_census tables (galdakao_zones, galdakao_streets, galdakao_zone_streets).
      # Once the resulting schema.rb is downloaded from the artifact, committed to the
      # repo, and db:schema:load covers all tables, this step must be removed.
      - name: Run pending migrations
        run: bundle exec rails db:migrate
        env:
          RAILS_ENV: test
          DATABASE_USERNAME: postgres
          DATABASE_PASSWORD: postgres

      # TEMPORARY: Upload the updated schema.rb as an artifact so it can be downloaded,
      # committed to the repo, and used from that point on by db:schema:load.
      # Remove this step once the schema.rb is committed.
      - name: Upload schema.rb artifact
        uses: actions/upload-artifact@v4
        with:
          name: schema
          path: db/schema.rb

      - name: Precompile assets
        run: |
          npm ci
          bundle exec rake assets:precompile
        env:
          RAILS_ENV: production
          DB_ADAPTER: nulldb
          SECRET_KEY_BASE: 1234567890

      - name: Run RSpec
        run: SIMPLECOV=1 CODECOV=1 bundle exec rspec gems/decidim-galdakao_census/spec/
        env:
          RAILS_ENV: test
          DATABASE_USERNAME: postgres
          DATABASE_PASSWORD: postgres

      - name: Lint Ruby files
        run: bundle exec rubocop -P
