en:
  decidim:
    authorization_handlers:
      admin:
        census_authorization_handler:
          help:
          - Citizens must be registered in the Galdakao municipal register to verify their identity.
          - Verification is performed against the municipal register using a national ID (DNI/NIE) and date of birth.
      census_authorization_handler:
        name: Galdakao municipal register
        explanation: Verify your identity using the Galdakao municipal register.
        fields:
          document_number: Document number (DNI/NIE)
          date_of_birth: Date of birth
          zones: Zones
        not_in_census: The data entered is not in the Galdakao municipal register.
        service_unavailable: The municipal register service is currently unavailable.
    authorization_modals:
      content:
        unauthorized:
          explanation: You do not meet the participation requirements for this process.
    events:
      galdakao_census:
        user_locked:
          email_intro: A participant has been blocked indefinitely after exceeding the maximum number of verification attempts.
          email_outro: Access the <a href="%{blocked_users_url}">blocked authorizations list</a> to manage the case.
          email_subject: Participant blocked due to excessive verification attempts
          notification_title: A participant has been blocked indefinitely after exceeding the maximum number of verification attempts.
      verifications:
        verify_with_managed_user:
          email_intro: A participant has tried to verify themselves with data that is already in use by another participant.
          email_outro: Check the <a href="%{conflicts_url}">Verifications conflicts list</a> to see the details and solve the issue.
          email_subject: Failed verification attempt against another participant
          notification_title: A participant has tried to verify themselves with data that is already in use by another participant.
    galdakao_census:
      action_authorizer:
        address_not_found: The municipal register did not return your full address (street and number), so we cannot check whether you live in the zones allowed for this action. Please contact the City Hall.
        not_in_zone: Your address in the municipal register is not within the zones allowed for this action.
      lockout:
        blocked_indefinitely: Your access has been blocked indefinitely. Please contact the administration.
        blocked_indefinitely_contact: You have exceeded the maximum number of attempts. Please contact the participation department of Galdakao City Hall.
        attempts_remaining: Incorrect data, you have %{remaining} attempts left out of 6.
        three_attempts: You have entered incorrect data 3 times. Please check your data. You will be able to try again in 5 minutes.
        wait: You must wait %{minutes} minutes and %{seconds} seconds before trying again.
      admin:
