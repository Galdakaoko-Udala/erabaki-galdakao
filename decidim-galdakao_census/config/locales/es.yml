es:
  decidim:
    authorization_handlers:
      admin:
        census_authorization_handler:
          help:
          - Los y las ciudadanas deben estar empadronadas en Galdakao para verificarse.
          - La verificación se realiza contra el padrón municipal mediante DNI/NIE y fecha de nacimiento.
      census_authorization_handler:
        name: Padrón municipal de Galdakao
        explanation: Verifica tu identidad mediante el padrón municipal de Galdakao.
        fields:
          document_number: Número de documento (DNI/NIE)
          date_of_birth: Fecha de nacimiento
        service_unavailable: El servicio del padrón no está disponible en este momento.
    authorization_modals:
      content:
        unauthorized:
          explanation: No cumples los requisitos de participación para este proceso.
    events:
      galdakao_census:
        user_locked:
          email_intro: Una participante ha sido bloqueada indefinidamente al superar el número máximo de intentos de verificación.
          email_outro: Accede al <a href="%{blocked_users_url}">listado de autorizaciones bloqueadas</a> para gestionar el caso.
          email_subject: Participante bloqueada por exceso de intentos de verificación
          notification_title: Una participante ha sido bloqueada indefinidamente al superar el número máximo de intentos de verificación.
      verifications:
        verify_with_managed_user:
          email_intro: Una participante ha intentado verificarse con datos que ya están en uso por otra participante.
          email_outro: Comprueba la <a href="%{conflicts_url}">lista de conflictos de verificaciones</a> para ver los detalles y resolver el problema.
          email_subject: Error al intentar verificarse contra otra participante
          notification_title: Una participante ha intentado verificarse con datos que ya están en uso por otra participante.
    galdakao_census:
      action_authorizer:
        address_not_found: El padrón municipal no ha devuelto tu dirección completa (calle y número), así que no podemos comprobar si vives en las zonas permitidas para esta acción. Ponte en contacto con el Ayuntamiento.
        not_in_zone: Tu dirección en el padrón municipal no está dentro de las zonas permitidas para esta acción.
      lockout:
        blocked_indefinitely: Tu acceso ha sido bloqueado indefinidamente. Contacta con la administración.
        blocked_indefinitely_contact: Has superado el número máximo de intentos. Por favor, ponte en contacto con el departamento de participación del Ayuntamiento de Galdakao.
        attempts_remaining: Datos incorrectos, te quedan %{remaining} intentos de 6.
        three_attempts: Has introducido datos erróneos 3 veces. Por favor revisa tus datos. Podrás volver a intentarlo en 5 minutos.
        wait: Debes esperar %{minutes} minutos y %{seconds} segundos antes de volver a intentarlo.
